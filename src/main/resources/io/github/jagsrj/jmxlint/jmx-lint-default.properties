# =====================================================================================
BP_INFINITE_LOOP.enabled=true
BP_INFINITE_LOOP.severity=ERROR

BP_RAMP_UP.enabled=true
BP_RAMP_UP.severity=WARN

BP_PARAMETERIZE_LOAD.enabled=true
BP_PARAMETERIZE_LOAD.severity=INFO

BP_THINK_TIME.enabled=true
BP_THINK_TIME.severity=WARN

BP_EMPTY_CONTAINER.enabled=true
BP_EMPTY_CONTAINER.severity=WARN

BP_MISSING_ASSERTION.enabled=true
BP_MISSING_ASSERTION.severity=WARN
BP_MISSING_ASSERTION.excludeTypes=DebugSampler,JSR223Sampler,BeanShellSampler

BP_TRANSACTION_INCLUDE_TIMERS.enabled=true
BP_TRANSACTION_INCLUDE_TIMERS.severity=WARN

BP_SAMPLER_OUTSIDE_TRANSACTION.enabled=true
BP_SAMPLER_OUTSIDE_TRANSACTION.severity=INFO
BP_SAMPLER_OUTSIDE_TRANSACTION.excludeTypes=DebugSampler,JSR223Sampler,BeanShellSampler

BP_EXTRACTOR_DEFAULT.enabled=true
BP_EXTRACTOR_DEFAULT.severity=INFO

BP_IF_CONTROLLER_EXPRESSION.enabled=true
BP_IF_CONTROLLER_EXPRESSION.severity=WARN

BP_CSV_ABSOLUTE_PATH.enabled=true
BP_CSV_ABSOLUTE_PATH.severity=WARN

BP_DISABLED_ELEMENTS.enabled=true
BP_DISABLED_ELEMENTS.severity=INFO

BP_TEST_PLAN_DESCRIPTION.enabled=true
BP_TEST_PLAN_DESCRIPTION.severity=INFO

BP_HARDCODED_HOST.enabled=true
BP_HARDCODED_HOST.severity=WARN

BP_HTTP_DEFAULTS.enabled=true
BP_HTTP_DEFAULTS.severity=INFO

BP_COOKIE_MANAGER.enabled=true
BP_COOKIE_MANAGER.severity=WARN

BP_HTTP_TIMEOUTS.enabled=true
BP_HTTP_TIMEOUTS.severity=WARN

BP_KEEPALIVE.enabled=true
BP_KEEPALIVE.severity=WARN

BP_HTTP_IMPLEMENTATION.enabled=true
BP_HTTP_IMPLEMENTATION.severity=INFO

BP_UNCORRELATED_VALUE.enabled=true
BP_UNCORRELATED_VALUE.severity=WARN
BP_UNCORRELATED_VALUE.namePattern=(?i).*(session|csrf|xsrf|token|viewstate|eventvalidation|nonce|requestverification).*
BP_UNCORRELATED_VALUE.minValueLength=8

# =====================================================================================
#  SECURITY
# =====================================================================================
SEC_HARDCODED_SECRET.enabled=true
SEC_HARDCODED_SECRET.severity=ERROR
SEC_HARDCODED_SECRET.namePattern=(?i).*(password|passwd|pwd|secret|api[_-]?key|apikey|authorization|access[_-]?key).*
SEC_HARDCODED_SECRET.propertyPattern=(?i)(^|\\.)(password|passwd|pwd|secret|apikey|api_key)$
SEC_HARDCODED_SECRET.bodyPattern=(?i)["']?(password|passwd|pwd|client_secret|api_?key)["']?\\s*[:=]\\s*["']?(?!\\$\\{)[^"'&,\\s}]{3,}

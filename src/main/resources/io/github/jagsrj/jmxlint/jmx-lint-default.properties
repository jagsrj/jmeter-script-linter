# =====================================================================================
#  JMX Lint - default rules
# =====================================================================================
#  This file is bundled in the plugin jar. Do NOT edit it here: copy only the keys you
#  want to change into your own team file (e.g. jmx-lint.properties next to your
#  scripts in git) and point the linter at it:
#     CLI   : java -jar jmx-lint.jar --rules jmx-lint.properties scripts/
#     JMeter: put jmx-lint.properties in JMETER_HOME/bin, or set
#             jmxlint.rules=/path/to/jmx-lint.properties in user.properties
#
#  Keys per rule:
#     <RULE_ID>.enabled  = true | false
#     <RULE_ID>.severity = ERROR | WARN | INFO
#     <RULE_ID>.<param>  = rule specific value
#
#  REGEX NOTE: this is a Java .properties file, so every backslash must be doubled:
#     \d  ->  \\d        \.  ->  \\.
#  An empty pattern switches that check off.
#
#  Suppress a rule on one element: put "lint-ignore: RULE_ID" (or "lint-ignore: ALL")
#  in that element's Comments field in JMeter.
# =====================================================================================

# ---- global --------------------------------------------------------------------------
# Lowest severity that makes the CLI exit with code 1 (ERROR | WARN | INFO | NONE)
global.failOn=ERROR
# Lint elements that are disabled in the tree as well
global.includeDisabledElements=false

# =====================================================================================
#  NAMING CONVENTIONS
# =====================================================================================
NAMING_TEST_PLAN.enabled=true
NAMING_TEST_PLAN.severity=WARN
NAMING_TEST_PLAN.pattern=^[A-Za-z][A-Za-z0-9 _.\\-]{2,79}$
NAMING_TEST_PLAN.maxLength=80
NAMING_TEST_PLAN.example=AccountOpening_Load_v1

# TG01_AccountOpening, SETUP_CreateUsers, TEARDOWN_Cleanup
NAMING_THREAD_GROUP.enabled=true
NAMING_THREAD_GROUP.severity=WARN
NAMING_THREAD_GROUP.pattern=^(TG\\d{2}|SETUP|TEARDOWN)_[A-Za-z][A-Za-z0-9_]*$
NAMING_THREAD_GROUP.maxLength=60
NAMING_THREAD_GROUP.example=TG01_AccountOpening

# T01_LaunchHomePage  or with a script prefix:  ACCOPEN_T01_LaunchHomePage
NAMING_TRANSACTION.enabled=true
NAMING_TRANSACTION.severity=WARN
NAMING_TRANSACTION.pattern=^(?:[A-Za-z0-9]+_)?T\\d{2,3}_[A-Za-z][A-Za-z0-9_]*$
NAMING_TRANSACTION.maxLength=60
NAMING_TRANSACTION.example=T01_LaunchHomePage

# Stricter alternative: ^\\d{2}_(GET|POST|PUT|PATCH|DELETE)_[A-Za-z0-9_]+$
NAMING_SAMPLER.enabled=true
NAMING_SAMPLER.severity=WARN
NAMING_SAMPLER.pattern=^[A-Za-z0-9][A-Za-z0-9 _.\\-]*$
NAMING_SAMPLER.maxLength=80
NAMING_SAMPLER.example=01_GET_HomePage

NAMING_DEFAULT_NAME.enabled=true
NAMING_DEFAULT_NAME.severity=WARN
NAMING_DEFAULT_NAME.defaultNames=Test Plan,Thread Group,setUp Thread Group,tearDown Thread Group,HTTP Request,JSR223 Sampler,BeanShell Sampler,Debug Sampler,JDBC Request,Java Request,TCP Sampler,Flow Control Action,FTP Request,SMTP Sampler,OS Process Sampler,LDAP Request,JMS Publisher,Transaction Controller,Simple Controller,Loop Controller,If Controller,While Controller,Runtime Controller,Throughput Controller,Once Only Controller,Random Controller,Switch Controller,ForEach Controller,Module Controller,Critical Section Controller,Interleave Controller,Regular Expression Extractor,JSON Extractor,Boundary Extractor,CSS Selector Extractor,XPath Extractor,XPath2 Extractor,JSON JMESPath Extractor,JSR223 PreProcessor,JSR223 PostProcessor,JSR223 Assertion,JSR223 Timer,BeanShell PreProcessor,BeanShell PostProcessor,bzm - Concurrency Thread Group,bzm - Arrivals Thread Group,jp@gc - Ultimate Thread Group,jp@gc - Stepping Thread Group (deprecated),Open Model Thread Group

# Names the HTTP(S) Test Script Recorder generates: "/login", "/api/v1/users-12"
NAMING_RECORDED_NAME.enabled=true
NAMING_RECORDED_NAME.severity=WARN
NAMING_RECORDED_NAME.pattern=^(/|https?://).*|.*-\\d+$

# Extractor reference names, CSV variable names, User Defined Variables.
# camelCase only : ^[a-z][a-zA-Z0-9]*$      UPPER_SNAKE only : ^[A-Z][A-Z0-9_]*$
NAMING_VARIABLE.enabled=true
NAMING_VARIABLE.severity=WARN
NAMING_VARIABLE.pattern=^[A-Za-z_][A-Za-z0-9_]*$

# scope = testPlan (names unique across the whole plan) | threadGroup
NAMING_DUPLICATE.enabled=true
NAMING_DUPLICATE.severity=WARN
NAMING_DUPLICATE.scope=testPlan
NAMING_DUPLICATE.excludeTypes=DebugSampler

NAMING_UNSAFE_CHARS.enabled=true
NAMING_UNSAFE_CHARS.severity=WARN
NAMING_UNSAFE_CHARS.forbiddenChars=[,"\\t\\r\\n<>|;]

# =====================================================================================
#  MEMORY & RESOURCE USAGE (load generator heap / Metaspace / handles)
# =====================================================================================
MEM_FUNCTIONAL_MODE.enabled=true
MEM_FUNCTIONAL_MODE.severity=ERROR

MEM_VIEW_RESULTS_TREE.enabled=true
MEM_VIEW_RESULTS_TREE.severity=ERROR

MEM_GUI_LISTENER.enabled=true
MEM_GUI_LISTENER.severity=WARN
MEM_GUI_LISTENER.allowedGuiClasses=SimpleDataWriter

MEM_SAVE_RESPONSE_DATA.enabled=true
MEM_SAVE_RESPONSE_DATA.severity=ERROR

MEM_RESULT_SAVER.enabled=true
MEM_RESULT_SAVER.severity=WARN

MEM_DEBUG_ELEMENT.enabled=true
MEM_DEBUG_ELEMENT.severity=WARN

MEM_BEANSHELL.enabled=true
MEM_BEANSHELL.severity=WARN

MEM_JSR223_LANGUAGE.enabled=true
MEM_JSR223_LANGUAGE.severity=WARN
MEM_JSR223_LANGUAGE.allowedLanguages=groovy

MEM_JSR223_NO_CACHE.enabled=true
MEM_JSR223_NO_CACHE.severity=WARN

# ${var} inside a Groovy script body = new class per distinct value = Metaspace leak
MEM_JSR223_INLINE_VARS.enabled=true
MEM_JSR223_INLINE_VARS.severity=ERROR

MEM_SCRIPT_THREADS.enabled=true
MEM_SCRIPT_THREADS.severity=WARN
MEM_SCRIPT_THREADS.pattern=new\\s+Thread\\s*\\(|Executors\\s*\\.\\s*new|new\\s+(java\\.util\\.)?Timer\\s*\\(|\\.parallelStream\\s*\\(

MEM_SCRIPT_UNCLOSED_RESOURCE.enabled=true
MEM_SCRIPT_UNCLOSED_RESOURCE.severity=WARN
MEM_SCRIPT_UNCLOSED_RESOURCE.pattern=new\\s+(FileWriter|FileReader|FileInputStream|FileOutputStream|BufferedReader|BufferedWriter|PrintWriter|RandomAccessFile|Socket|Scanner)\\s*\\(|DriverManager\\s*\\.\\s*getConnection|\\.openConnection\\s*\\(|\\.openStream\\s*\\(
MEM_SCRIPT_UNCLOSED_RESOURCE.mitigationPattern=\\.close\\s*\\(|\\.with(Writer|Reader|Closeable|PrintWriter|InputStream|OutputStream|Stream)\\b|\\.eachLine\\b|\\btry\\s*\\(

MEM_SCRIPT_GROWING_STATE.enabled=true
MEM_SCRIPT_GROWING_STATE.severity=INFO
MEM_SCRIPT_GROWING_STATE.pattern=props\\s*\\.\\s*put(Object)?\\s*\\(|vars\\s*\\.\\s*putObject\\s*\\(|static\\s+[\\w<>,\\s]*=\\s*new\\s+(java\\.util\\.)?(concurrent\\.)?(HashMap|ArrayList|LinkedList|ConcurrentHashMap|HashSet|LinkedHashMap|TreeMap)

MEM_EMBEDDED_NO_CACHE.enabled=true
MEM_EMBEDDED_NO_CACHE.severity=WARN

MEM_EXTRACT_ALL_MATCHES.enabled=true
MEM_EXTRACT_ALL_MATCHES.severity=INFO


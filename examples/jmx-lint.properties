# Example TEAM rules file - commit this next to your .jmx scripts.
# Only list what differs from the built-in defaults
# (see them with: java -jar jmx-lint.jar --print-default-config).
# Remember: double every backslash in regexes (\d -> \\d).

# Fail the CI build on warnings too
global.failOn=WARN

# Our convention: TG01_Business_Flow / T01_Step_Name / 01_GET_Resource
NAMING_THREAD_GROUP.pattern=^TG\\d{2}_[A-Z][A-Za-z0-9_]*$
NAMING_TRANSACTION.pattern=^T\\d{2}_[A-Z][A-Za-z0-9_]*$
NAMING_SAMPLER.pattern=^\\d{2}_(GET|POST|PUT|PATCH|DELETE)_[A-Za-z0-9_]+$
NAMING_SAMPLER.example=01_GET_Accounts

# Variables must be camelCase
NAMING_VARIABLE.pattern=^[a-z][a-zA-Z0-9]*$

# We report per thread group, so duplicates across thread groups are fine
NAMING_DUPLICATE.scope=threadGroup

# Every sampler must sit in a transaction - make it a warning
BP_SAMPLER_OUTSIDE_TRANSACTION.severity=WARN

# Not relevant for API-only scripts
MEM_EMBEDDED_NO_CACHE.enabled=false
